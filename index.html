<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Taxas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      font-size: 16px;
    }

    #resultado {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
<img src="WhatsApp%20Image%202024-10-17%20at%2010.32.27%20AM.jpeg" alt="Logo Moontsun" style="width: 120px; margin: 0 auto 20px; display: block;">
  <h2>Calculadora de Taxas</h2>

  <label for="preco">Valor do produto (R$):</label>
  <input type="number" id="preco" placeholder="Digite o valor" step="0.01">

  <label for="plataforma">Plataforma:</label>
  <select id="plataforma">
    <option value="">Selecione</option>
    <option value="shopee">Shopee</option>
    <option value="mercado_livre">Mercado Livre (Clássico)</option>
    <option value="shein">Shein</option>
  </select>

  <div id="resultado"></div>

  <script>
    const precoInput = document.getElementById('preco');
    const plataformaSelect = document.getElementById('plataforma');
    const resultadoDiv = document.getElementById('resultado');

    function calcular() {
      const preco = parseFloat(precoInput.value);
      const plataforma = plataformaSelect.value;

      if (isNaN(preco) || !plataforma) {
        resultadoDiv.textContent = '';
        return;
      }

      let taxaPercentual = 0;
      let taxaFixa = 0;

      switch (plataforma) {
        case 'shopee':
          taxaPercentual = 0.20;
          taxaFixa = 4.00;
          break;
        case 'mercado_livre':
          taxaPercentual = 0.16;
          taxaFixa = 6.50;
          break;
        case 'shein':
          taxaPercentual = 0.20;
          break;
      }

      const precoComTaxa = (preco + taxaFixa) / (1 - taxaPercentual);
      resultadoDiv.textContent = `Preço sugerido: R$ ${precoComTaxa.toFixed(2)}`;
    }

    precoInput.addEventListener('input', calcular);
    plataformaSelect.addEventListener('change', calcular);
  </script>

</body>
</html>
